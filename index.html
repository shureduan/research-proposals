<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Proposals</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
  :root {
    --bg: #fbfbfa; --fg: #1f2328; --muted: #656d76; --line: #d8dee4;
    --card: #ffffff; --accent: #1f6feb; --accent-fg: #ffffff; --code: #f3f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --line: #30363d;
      --card: #161b22; --accent: #4493f8; --accent-fg: #0d1117; --code: #1f242c;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 72px; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  }
  .bar {
    max-width: 860px; margin: 0 auto; padding: 12px 16px;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .bar .label { color: var(--muted); font-size: 14px; margin-right: 4px; }
  .tab {
    border: 1px solid var(--line); background: var(--card); color: var(--fg);
    padding: 7px 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .tab:hover { border-color: var(--accent); }
  .tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
  article h1 { font-size: 1.9rem; line-height: 1.3; margin: 0.4em 0 0.6em; }
  article h2 { font-size: 1.4rem; margin-top: 2em; padding-bottom: 0.3em; border-bottom: 1px solid var(--line); }
  article h3 { font-size: 1.15rem; margin-top: 1.6em; }
  article a { color: var(--accent); }
  article hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }
  article blockquote { margin: 1.2em 0; padding: 0.4em 1em; border-left: 4px solid var(--accent); color: var(--fg); background: var(--code); border-radius: 0 6px 6px 0; }
  article code { background: var(--code); padding: 0.15em 0.35em; border-radius: 4px; font-size: 0.9em; }
  article pre { background: var(--code); padding: 12px 14px; border-radius: 8px; overflow-x: auto; }
  article pre code { background: none; padding: 0; }
  article table { border-collapse: collapse; display: block; overflow-x: auto; margin: 1.2em 0; font-size: 0.93em; }
  article th, article td { border: 1px solid var(--line); padding: 6px 10px; vertical-align: top; }
  article th { background: var(--code); text-align: left; }
  .katex-display { overflow-x: auto; overflow-y: hidden; padding: 4px 0; }
  .status { color: var(--muted); }
</style>
</head>
<body>
<header>
  <nav class="bar" role="tablist">
    <span class="label">Proposal:</span>
    <button class="tab" role="tab" data-id="indoor">Indoor Robotic Perception</button>
    <button class="tab" role="tab" data-id="anchor">Task-Aware Anchor–Delta</button>
  </nav>
</header>
<main><article id="doc"><p class="status">Loading…</p></article></main>
<script>
  const DOCS = {
    indoor: "proposals/indoor-robotic-perception.md",
    anchor: "proposals/task-aware-anchor-delta.md",
  };
  const cache = {};
  const doc = document.getElementById("doc");

  // Pull math out before markdown parsing so marked doesn't mangle it.
  function render(md) {
    const math = [];
    const stash = (tex, display) => `@@MATH${math.push({ tex, display }) - 1}@@`;
    md = md.replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => "\n\n" + stash(t, true) + "\n\n")
           .replace(/\$([^\n$]+?)\$/g, (_, t) => stash(t, false));
    let html = marked.parse(md);
    return html.replace(/@@MATH(\d+)@@/g, (_, i) => {
      const { tex, display } = math[i];
      try { return katex.renderToString(tex, { displayMode: display, throwOnError: false }); }
      catch { return tex; }
    });
  }

  async function show(id) {
    if (!DOCS[id]) id = "indoor";
    document.querySelectorAll(".tab").forEach(b =>
      b.setAttribute("aria-selected", b.dataset.id === id));
    if (!cache[id]) {
      doc.innerHTML = '<p class="status">Loading…</p>';
      const res = await fetch(DOCS[id]);
      cache[id] = render(await res.text());
    }
    doc.innerHTML = cache[id];
    document.title = doc.querySelector("h1")?.textContent || "Research Proposals";
    window.scrollTo(0, 0);
  }

  document.querySelectorAll(".tab").forEach(b =>
    b.addEventListener("click", () => { location.hash = b.dataset.id; }));
  window.addEventListener("hashchange", () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>
</body>
</html>
